<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>临江市 POI 空间分布分析系统</title>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/vendor/leaflet.markercluster/MarkerCluster.css">
<link rel="stylesheet" href="/vendor/leaflet.markercluster/MarkerCluster.Default.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<aside id="sidebar">
  <header>
    <h1>临江市 POI 空间分布分析系统</h1>
    <p class="sub">PostGIS 空间数据库 · Node.js API · Leaflet 可视化 ｜ 数据为模拟生成</p>
  </header>

  <section>
    <h2>分析模式</h2>
    <div class="modes">
      <button class="mode-btn active" data-mode="cluster">📍 点位聚合</button>
      <button class="mode-btn" data-mode="heat">🔥 热力图</button>
      <button class="mode-btn" data-mode="hex">⬡ 六边形密度</button>
    </div>
  </section>

  <section>
    <h2>类别筛选 <span id="cat-hint" class="hint"></span></h2>
    <div id="cat-list" class="cat-list"></div>
    <div class="row-btns"><button id="cat-all">全选</button><button id="cat-none">清空</button></div>
  </section>

  <section>
    <h2>最近设施检索</h2>
    <div class="search-row">
      <input id="kw" placeholder="关键词，如：火锅 / 便利店 / 医院">
      <button id="btn-nearest">检索</button>
    </div>
    <p class="hint">以当前视图中心为起点，KNN 空间排序（GiST 索引）</p>
    <ul id="nearest-list" class="result-list"></ul>
  </section>

  <section>
    <h2>缓冲区分析</h2>
    <div class="search-row">
      <select id="buf-r">
        <option value="500">半径 500 m</option>
        <option value="1000" selected>半径 1 km</option>
        <option value="2000">半径 2 km</option>
      </select>
      <button id="btn-buffer">圈选</button>
    </div>
    <p class="hint" id="buf-hint">点击「圈选」后在地图上点击圆心</p>
    <div id="buf-result"></div>
  </section>

  <footer>
    <span id="status">就绪</span>
  </footer>
</aside>

<main id="map"></main>

<div id="map-chip">视野内 POI：—</div>

<button id="panel-toggle">统计图表 ◀</button>
<section id="charts-panel">
  <div class="chart-box"><h3>类别构成</h3><div id="chart-pie" class="chart"></div></div>
  <div class="chart-box"><h3>行政区分布</h3><div id="chart-bar" class="chart"></div></div>
  <div class="chart-box">
    <h3>空间自相关检验（全局 Moran's I）
      <button id="btn-moran" class="mini">计算</button></h3>
    <div id="moran-card" class="moran-card">点击「计算」对当前视野的六边形密度做空间自相关检验</div>
  </div>
</section>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/vendor/leaflet.markercluster/leaflet.markercluster.js"></script>
<script src="/vendor/leaflet.heat/leaflet-heat.js"></script>
<script src="/vendor/echarts/echarts.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
